<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-label="It’s all about the brakes">
  <title>It’s all about the brakes</title>
  <!--
    Dark-mode native. Palette:
      bg     #0F1216  deep blue-charcoal, baked in so the lockup carries its own darkness
      ink    #ECEEF2  cool off-white, reserved for the lever and the word BRAKES
      slate  #8A94A6  everything structural: ground, ratchet, tagline
      lamp   #F2453A  brake-light red, with a soft glow on the grip, the one lit element
  -->
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="720" height="220" rx="20" fill="#0F1216"/>
  <!-- Mark: a handbrake, pulled. -->
  <g transform="translate(30 20)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M111.3 140 A72 72 0 0 0 90 98.2" stroke="#8A94A6" stroke-width="2" opacity="0.45"/>
    <path d="M111.3 140 A72 72 0 0 0 90 98.2" stroke="#8A94A6" stroke-width="7" stroke-dasharray="3 8" stroke-linecap="butt"/>
    <path d="M8 172 H150" stroke="#8A94A6" stroke-width="8"/>
    <path d="M40 150 L128 52" stroke="#ECEEF2" stroke-width="20"/>
    <!-- lit grip: glow underneath, solid on top -->
    <path d="M94.6 89.2 L128 52" stroke="#F2453A" stroke-width="34" opacity="0.55" filter="url(#glow)"/>
    <path d="M94.6 89.2 L128 52" stroke="#F2453A" stroke-width="30"/>
    <circle cx="142" cy="36" r="8" fill="#ECEEF2"/>
    <circle cx="40" cy="150" r="13" fill="#ECEEF2"/>
    <circle cx="40" cy="150" r="5" fill="#F2453A"/>
  </g>
  <!-- Wordmark: the tagline recedes to slate; BRAKES is the only white word; the stop is the lamp. -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="230" y="88" font-size="22" font-weight="600" letter-spacing="6" fill="#8A94A6">IT’S ALL ABOUT THE</text>
    <text x="226" y="166" font-size="84" font-weight="800" letter-spacing="-2" fill="#ECEEF2">BRAKES<tspan fill="#F2453A">.</tspan></text>
  </g>
</svg>
